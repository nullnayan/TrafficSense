name: Verify TrafficSense
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: trafficsense
          POSTGRES_USER: trafficsense
          POSTGRES_PASSWORD: trafficsense_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trafficsense -d trafficsense"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://trafficsense:trafficsense_dev@localhost:5432/trafficsense
      REDIS_URL: redis://localhost:6379/0
      INFERENCE_MODE: calibrated_teacher
      INGESTION_ENABLED: 'false'
      INGESTION_SOURCE_MODE: fixtures
      DIRECT_SCRAPERS_ENABLED: 'false'
      TRAFFICSENSE_INTEGRATION: '1'
      PGPASSWORD: trafficsense_dev
      LLM_API_KEY: ''
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python scripts/check_publication.py
      - run: python -m pip install -r requirements-dev.txt
      - name: Initialize fresh PostGIS schema in migration order
        run: |
          for file in sql/[0-9][0-9]_*.sql; do
            psql -h localhost -U trafficsense -d trafficsense -v ON_ERROR_STOP=1 -f "$file"
          done
      - run: python -m ruff check backend tests scripts training/train_setfit.py
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
